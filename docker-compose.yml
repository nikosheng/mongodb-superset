  superset-init:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: superset-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: this_is_a_demo_secret_key_change_me
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_home:/app/superset_home
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin || true) &&
        superset init

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: superset
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: this_is_a_demo_secret_key_change_me
      SUPERSET_LOAD_EXAMPLES: "no"
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    command:
      - /bin/sh
      - -c
      - |
        exec superset run -h 0.0.0.0 -p 8088

volumes:
  mongodb_data:
  superset_home:
