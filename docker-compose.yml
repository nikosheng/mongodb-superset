          { item: "Laptop", category: "Electronics", region: "NA", amount: 1299, quantity: 3, order_date: ISODate("2025-01-10T00:00:00Z") },
          { item: "Phone", category: "Electronics", region: "EU", amount: 799, quantity: 5, order_date: ISODate("2025-01-14T00:00:00Z") },
