name: mongodb-superset-demo

services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "mongodb://root:example@localhost:27017/admin?authSource=admin"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-seed:
    image: mongo:8.0
    container_name: mongo-seed
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        mongosh "mongodb://root:example@mongodb:27017/admin?authSource=admin" <<'EOF'
        db = db.getSiblingDB('demo');
