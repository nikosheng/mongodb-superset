map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream superset_backend {
    least_conn;
    server superset-web-1:8088 max_fails=3 fail_timeout=30s;
    server superset-web-2:8088 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 8088;
    server_name _;

    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    location = /health {
        proxy_pass http://superset_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://superset_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
